<script>
  const PageArsipLink = {
    template: `
      <div class="space-y-6">
        <!-- Header & Tombol Tambah -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

        <div>
          <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
            <span class="text-gray-600 flex items-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            </span>
            Arsip Link/Aplikasi
          </h1>
          <p class="text-gray-600 text-sm">Kelola daftar arsip dokumentasi, tautan, dan laporan kegiatan.</p>
        </div>
          
          <div class="flex items-center space-x-2">
            <button @click="fetchData" class="bg-white hover:bg-blue-50 text-blue-600 border border-blue-300 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-1 shadow-sm" title="Refresh Data">
              <span>🔄</span>
            </button>
            <button @click="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
              <span>Tambah Link Baru</span>
            </button>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between gap-4">
          <div class="w-full md:w-1/3">
            <input type="text" v-model="searchQuery" placeholder="Cari nama, deskripsi, atau keterangan..." 
                   class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="w-full md:w-1/4">
            <select v-model="selectedTahun" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Semua Tahun</option>
              <option v-for="thn in uniqueTahun" :key="thn" :value="thn">{{ thn }}</option>
            </select>
          </div>
        </div>

        <!-- Kartu Utama Tabel (Berisi Control Top, Tabel, & Pagination di dalam border) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          
          <!-- Kontrol Bar Atas di dalam Card -->
          <div class="p-6 pb-4 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-600 gap-2 border-b border-gray-100">
            <div class="flex items-center space-x-2">
              <span>Tampilkan</span>
              <select v-model.number="itemsPerPage" @change="currentPage = 1" class="border border-gray-200 rounded-lg px-2.5 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option :value="5">5</option>
                <option :value="10">10</option>
                <option :value="25">25</option>
                <option :value="50">50</option>
              </select>
              <span>data per halaman</span>
            </div>
            <div>
              <span v-if="filteredData.length > 0">Menampilkan {{ startIndex + 1 }} - {{ endIndex }} dari {{ filteredData.length }} data</span>
              <span v-else>Menampilkan 0 data</span>
            </div>
          </div>

          <!-- Tabel Data -->
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-gray-50 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-200">
                  <th class="py-3 px-6 font-semibold w-12 text-center">No</th>
                  <th class="py-3 px-4 font-semibold cursor-pointer" @click="sortBy('tahun')">
                    Tahun <span>{{ sortField === 'tahun' ? (sortAsc ? '▲' : '▼') : '' }}</span>
                  </th>
                  <th class="py-3 px-4 font-semibold cursor-pointer" @click="sortBy('nama')">
                    Nama <span>{{ sortField === 'nama' ? (sortAsc ? '▲' : '▼') : '' }}</span>
                  </th>
                  <th class="py-3 px-4 font-semibold">Link</th>
                  <th class="py-3 px-4 font-semibold cursor-pointer" @click="sortBy('kategori')">
                    Kategori <span>{{ sortField === 'kategori' ? (sortAsc ? '▲' : '▼') : '' }}</span>
                  </th>
                  <th class="py-3 px-4 font-semibold text-center">VPN</th>
                  <th class="py-3 px-4 font-semibold">Deskripsi</th>
                  <th class="py-3 px-4 font-semibold">Keterangan</th>
                  <th class="py-3 px-6 font-semibold text-center">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100 text-sm text-gray-600">
                <tr v-if="loading">
                  <td colspan="9" class="py-8 text-center text-gray-400">Memuat data dari Google Sheets...</td>
                </tr>
                <tr v-else-if="paginatedData.length === 0">
                  <td colspan="9" class="py-8 text-center text-gray-400">Tidak ada data yang ditemukan.</td>
                </tr>
                <tr v-for="(item, index) in paginatedData" :key="item.rowIndex" class="hover:bg-gray-50 transition">
                  <td class="py-3 px-6 text-center font-medium text-gray-500">{{ startIndex + index + 1 }}</td>
                  <td class="py-3 px-4 font-medium text-gray-800">
                    <span class="bg-gray-100 px-2.5 py-1 rounded text-xs font-semibold">{{ item.tahun }}</span>
                  </td>
                  <td class="py-3 px-4 font-semibold text-gray-800">{{ item.nama }}</td>
                  <td class="py-3 px-4">
                    <a :href="item.link" target="_blank" class="text-blue-600 hover:underline truncate max-w-xs block font-medium">
                      {{ item.link }}
                    </a>
                  </td>
                  <td class="py-3 px-4">
                    <span :class="item.kategori === 'Aplikasi' ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-blue-50 text-blue-700 border-blue-200'" class="border px-2.5 py-0.5 rounded-full text-xs font-medium">
                      {{ item.kategori || 'Link' }}
                    </span>
                  </td>
                  <td class="py-3 px-4 text-center">
                    <span v-if="String(item.vpn).toLowerCase() === 'true'" class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded text-xs font-semibold">
                      ✔
                    </span>
                    <span v-else class="bg-slate-100 text-slate-500 border border-slate-200 px-2 py-0.5 rounded text-xs font-semibold">
                      ✘
                    </span>
                  </td>
                  <td class="py-3 px-4">{{ item.deskripsi }}</td>
                  <td class="py-3 px-4 text-gray-500 italic">{{ item.keterangan || '-' }}</td>
                  <td class="py-3 px-6 text-center space-x-2 whitespace-nowrap">
                    <button @click="openModal(item)" class="text-amber-600 hover:text-amber-800 font-medium text-xs bg-amber-50 px-2.5 py-1 rounded transition">Edit</button>
                    <button @click="deleteData(item.rowIndex)" class="text-red-600 hover:text-red-800 font-medium text-xs bg-red-50 px-2.5 py-1 rounded transition">Hapus</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination Bar Bawah di dalam Card -->
          <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between text-sm text-gray-600 gap-4">
            <div>
              Halaman {{ currentPage }} dari {{ totalPages || 1 }}
            </div>
            <div class="flex items-center space-x-1">
              <!-- Tombol Previous -->
              <button @click="currentPage--" :disabled="currentPage === 1" 
                      class="w-8 h-8 flex items-center justify-center bg-white border border-gray-200 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100 transition">
                ‹
              </button>
              
              <!-- Daftar Nomor Halaman Dinamis (Maksimal 5 dengan Ellipsis) -->
              <template v-for="(page, idx) in visiblePages">
                <button v-if="page !== '...'" :key="'page-' + idx" @click="currentPage = page"
                        :class="['w-8 h-8 flex items-center justify-center border rounded-lg text-sm font-medium transition', currentPage === page ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-100']">
                  {{ page }}
                </button>
                <span v-else :key="'dot-' + idx" class="w-8 h-8 flex items-center justify-center text-gray-400 font-medium">
                  ...
                </span>
              </template>

              <!-- Tombol Next -->
              <button @click="currentPage++" :disabled="currentPage >= totalPages" 
                      class="w-8 h-8 flex items-center justify-center bg-white border border-gray-200 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100 transition">
                ›
              </button>
            </div>
          </div>

        </div>

        <!-- Modal Form Tambah / Edit -->
        <div v-if="isModalOpen" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
              <h3 class="font-bold text-gray-800">{{ form.rowIndex ? 'Edit Link Aplikasi' : 'Tambah Link Aplikasi Baru' }}</h3>
              <button @click="closeModal" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <form @submit.prevent="saveData" class="p-6 space-y-4">
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Tahun <span class="text-red-500">*</span></label>
                <input type="number" v-model="form.tahun" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: 2026">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Nama Link/Aplikasi <span class="text-red-500">*</span></label>
                <input type="text" v-model="form.nama" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Link URL <span class="text-red-500">*</span></label>
                <input type="url" v-model="form.link" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              
              <!-- Pilihan Kategori dan VPN -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Kategori <span class="text-red-500">*</span></label>
                  <select v-model="form.kategori" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Link">Link</option>
                    <option value="Aplikasi">Aplikasi</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">VPN <span class="text-red-500">*</span></label>
                  <select v-model="form.vpn" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option :value="false">False</option>
                    <option :value="true">True</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Deskripsi <span class="text-red-500">*</span></label>
                <textarea v-model="form.deskripsi" rows="2" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Keterangan <span class="text-gray-400">(Opsional)</span></label>
                <textarea v-model="form.keterangan" rows="2" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </div>
              <div class="flex justify-end space-x-2 pt-2">
                <button type="button" @click="closeModal" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">Batal</button>
                <button type="submit" :disabled="saving" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition disabled:opacity-50">
                  {{ saving ? 'Menyimpan...' : 'Simpan' }}
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    `,
    setup() {
      const { ref, computed, onMounted, watch } = Vue;
      
      const tableData = ref([]);
      const loading = ref(true);
      const saving = ref(false);
      
      const searchQuery = ref('');
      const selectedTahun = ref('');
      const sortField = ref('tahun');
      const sortAsc = ref(false);
      
      const currentPage = ref(1);
      const itemsPerPage = ref(10); // Default 10 data per halaman
      
      const isModalOpen = ref(false);
      
      // Inisialisasi form mencakup kategori dan vpn
      const form = ref({ 
        rowIndex: '', 
        tahun: '', 
        nama: '', 
        link: '', 
        kategori: 'Link', 
        vpn: false, 
        deskripsi: '', 
        keterangan: '' 
      });

      const fetchData = () => {
        loading.value = true;
        google.script.run
          .withSuccessHandler(res => {
            if (res.status) {
              tableData.value = res.data;
            } else {
              alert(res.message);
            }
            loading.value = false;
          })
          .withFailureHandler(err => {
            alert("Gagal memuat data: " + err.message);
            loading.value = false;
          })
          .getLinkAplikasiData();
      };

      onMounted(() => {
        fetchData();
      });

      const uniqueTahun = computed(() => {
        const tahuns = tableData.value.map(item => item.tahun).filter(Boolean);
        return [...new Set(tahuns)].sort((a, b) => b - a);
      });

      const filteredData = computed(() => {
        return tableData.value.filter(item => {
          const matchSearch = (item.nama || '').toLowerCase().includes(searchQuery.value.toLowerCase()) ||
                              (item.deskripsi || '').toLowerCase().includes(searchQuery.value.toLowerCase()) ||
                              (item.keterangan || '').toLowerCase().includes(searchQuery.value.toLowerCase());
          const matchTahun = selectedTahun.value === '' || String(item.tahun) === String(selectedTahun.value);
          return matchSearch && matchTahun;
        }).sort((a, b) => {
          let modifier = sortAsc.value ? 1 : -1;
          let valA = a[sortField.value];
          let valB = b[sortField.value];
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
          if (valA < valB) return -1 * modifier;
          if (valA > valB) return 1 * modifier;
          return 0;
        });
      });

      // Reset ke halaman 1 ketika pencarian/filter berubah
      watch([searchQuery, selectedTahun], () => {
        currentPage.value = 1;
      });

      const totalPages = computed(() => {
        return Math.ceil(filteredData.value.length / itemsPerPage.value) || 1;
      });

      const startIndex = computed(() => {
        return (currentPage.value - 1) * itemsPerPage.value;
      });

      const endIndex = computed(() => {
        const end = startIndex.value + itemsPerPage.value;
        return end > filteredData.value.length ? filteredData.value.length : end;
      });

      const paginatedData = computed(() => {
        return filteredData.value.slice(startIndex.value, endIndex.value);
      });

      const sortBy = (field) => {
        if (sortField.value === field) {
          sortAsc.value = !sortAsc.value;
        } else {
          sortField.value = field;
          sortAsc.value = true;
        }
      };

      const openModal = (item = null) => {
        if (item) {
          form.value = { ...item };
        } else {
          form.value = { 
            rowIndex: '', 
            tahun: new Date().getFullYear(), 
            nama: '', 
            link: '', 
            kategori: 'Link', 
            vpn: false, 
            deskripsi: '', 
            keterangan: '' 
          };
        }
        isModalOpen.value = true;
      };

      const closeModal = () => {
        isModalOpen.value = false;
      };

      const saveData = () => {
        saving.value = true;
        google.script.run
          .withSuccessHandler(res => {
            saving.value = false;
            if (res.status) {
              alert(res.message);
              closeModal();
              fetchData();
            } else {
              alert(res.message);
            }
          })
          .withFailureHandler(err => {
            saving.value = false;
            alert("Terjadi kesalahan: " + err.message);
          })
          .saveLinkAplikasi(form.value);
      };

      const deleteData = (rowIndex) => {
        if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
          google.script.run
            .withSuccessHandler(res => {
              if (res.status) {
                alert(res.message);
                fetchData();
              } else {
                alert(res.message);
              }
            })
            .withFailureHandler(err => {
              alert("Gagal menghapus: " + err.message);
            })
            .deleteLinkAplikasi(rowIndex);
        }
      };

      const visiblePages = computed(() => {
        let pages = [];
        let total = totalPages.value;
        let current = currentPage.value;
        
        if (total <= 5) {
          for (let i = 1; i <= total; i++) pages.push(i);
        } else {
          if (current <= 3) {
            pages = [1, 2, 3, 4, '...', total];
          } else if (current >= total - 2) {
            pages = [1, '...', total - 3, total - 2, total - 1, total];
          } else {
            pages = [1, '...', current - 1, current, current + 1, '...', total];
          }
        }
        return pages;
      });

      return {
        tableData,
        loading,
        saving,
        searchQuery,
        selectedTahun,
        uniqueTahun,
        sortField,
        sortAsc,
        currentPage,
        itemsPerPage,
        totalPages,
        startIndex,
        endIndex,
        paginatedData,
        sortBy,
        isModalOpen,
        form,
        openModal,
        closeModal,
        saveData,
        deleteData,
        fetchData,
        filteredData,
        visiblePages
      };
    }
  };
  </script>
