<aside :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'" 
       class="fixed inset-y-0 left-0 z-50 w-64 bg-white text-gray-700 flex flex-col min-h-screen border-r border-gray-200 shadow-sm transition-transform duration-300 ease-in-out md:translate-x-0 md:static">
  
  <!-- Brand / Header Sidebar -->
  <div class="p-5 text-lg font-bold text-gray-800 border-b border-gray-100 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">
        S
      </div>
      <span title="Sistem Informasi Pengelolaan Administrasi Lengkap Abdya">SIPALA</span>
    </div>
    <!-- Tombol Close khusus Mobile -->
    <button @click="toggleSidebar" class="md:hidden text-gray-500 hover:text-gray-700 focus:outline-none">
      ✕
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <!-- Beranda -->
    <button @click="currentMenu = 'beranda'; toggleMobileSidebar()" 
      :class="currentMenu === 'beranda' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-sm">Beranda</span>
    </button>

    <!-- Menu Anggaran -->
    <button @click="currentMenu = 'anggaran'; toggleMobileSidebar()" 
      :class="currentMenu === 'anggaran' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
      <span class="text-sm">Anggaran</span>
    </button>

    <!-- Menu Administrasi dengan Submenu -->
    <div>
      <button @click="isAdministrasiOpen = !isAdministrasiOpen" 
        :class="['nomor_surat', 'spm_spider'].includes(currentMenu) ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
        class="w-full flex items-center justify-between px-4 py-2.5 rounded-lg transition duration-150">
        <div class="flex items-center space-x-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span class="text-sm">Menu Administrasi</span>
        </div>
        <svg :class="isAdministrasiOpen ? 'rotate-180' : ''" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Daftar Submenu Administrasi -->
      <div v-show="isAdministrasiOpen" class="pl-4 mt-1 space-y-1 border-l-2 border-blue-100 ml-4">
        <!-- Submenu: Nomor Surat (Diubah dari text-xs ke text-sm) -->
        <button @click="currentMenu = 'nomor_surat'; toggleMobileSidebar()" 
          :class="currentMenu === 'nomor_surat' ? 'text-blue-600 font-semibold bg-blue-50/50' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-50'"
          class="w-full text-left px-3 py-2 rounded-md text-sm transition duration-150 flex items-center space-x-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Nomor Surat</span>
        </button>

        <!-- Submenu: SPM Spider (Diubah dari text-xs ke text-sm) -->
        <button @click="currentMenu = 'spm_spider'; toggleMobileSidebar()" 
          :class="currentMenu === 'spm_spider' ? 'text-blue-600 font-semibold bg-blue-50/50' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-50'"
          class="w-full text-left px-3 py-2 rounded-md text-sm transition duration-150 flex items-center space-x-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>SPM Spider</span>
        </button>
      </div>
    </div>

    <!-- Menu Dokumentasi -->
    <button @click="currentMenu = 'dokumentasi'; toggleMobileSidebar()" 
      :class="currentMenu === 'dokumentasi' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      <span class="text-sm">Dokumentasi</span>
    </button>

    <!-- Menu Arsip Link Aplikasi -->
    <button @click="currentMenu = 'arsip_link'; toggleMobileSidebar()" 
      :class="currentMenu === 'arsip_link' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
      <span class="text-sm">Arsip Link Aplikasi</span>
    </button>

    <!-- Menu Monitoring Kegiatan -->
    <button @click="currentMenu = 'monitoring_kegiatan'; toggleMobileSidebar()" 
      :class="currentMenu === 'monitoring_kegiatan' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"></path></svg>
      <span class="text-sm">Monitoring Kegiatan</span>
    </button>

    <!-- Menu Monitoring Kinerja -->
    <!--
    <button @click="currentMenu = 'monitoring_kinerja'; toggleMobileSidebar()" 
      :class="currentMenu === 'monitoring_kinerja' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      <span class="text-sm">Monitoring Kinerja</span>
    </button>
    -->

    <!-- Menu Rakan Mitra -->
    <button @click="currentMenu = 'rakan_mitra'; toggleMobileSidebar()" 
      :class="currentMenu === 'rakan_mitra' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-sm">Rakan Mitra</span>
    </button>

    <!-- Menu Lainnya -->
    <button @click="currentMenu = 'lainnya'; toggleMobileSidebar()" 
      :class="currentMenu === 'lainnya' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'"
      class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      <span class="text-sm">Lainnya</span>
    </button>
  </nav>
</aside>

<!-- Backdrop hitam transparan saat sidebar terbuka di mobile -->
<div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black/50 z-40 md:hidden"></div>
