            if (res.status) {
              rawData.value = res.data;
            } else {
              alert(res.message);
            }
            loading.value = false;
          })
          .withFailureHandler(err => {
            alert("Gagal memuat data SPBY: " + err.message);
            loading.value = false;
          })
          .getSpbyDataLocal();
      };

      const syncData = () => {
        syncing.value = true;
        google.script.run
          .withSuccessHandler(res => {
            syncing.value = false;
            if (res.status) {
              rawData.value = res.data;
              alert("Data SPBY berhasil diperbarui!");
            } else {
              alert(res.message);
            }
          })
          .withFailureHandler(err => {
            syncing.value = false;
            alert("Gagal sinkronisasi data: " + err.message);
          })
          .syncAndGetSpbyData();
      };

      onMounted(() => {
        fetchData();
      });

      const sheetOptions = computed(() => {
        const set = new Set(rawData.value.map(i => i.sheetAsal).filter(Boolean));
        return Array.from(set);
      });

      const statusOptions = computed(() => {
        const set = new Set(rawData.value.map(i => String(i.sudahBayar)).filter(Boolean));
        return Array.from(set);
      });

      const filteredData = computed(() => {
        const query = searchQuery.value.toLowerCase();
        return rawData.value.filter(item => {
          const matchSearch = String(item.noSpby).toLowerCase().includes(query) || 
                              String(item.pembayaran).toLowerCase().includes(query) ||
                              String(item.akun).toLowerCase().includes(query) ||
                              String(item.program).toLowerCase().includes(query);
          const matchSheet = selectedSheet.value === 'ALL' || item.sheetAsal === selectedSheet.value;
          const matchStatus = selectedStatus.value === 'ALL' || String(item.sudahBayar) === String(selectedStatus.value);
          return matchSearch && matchSheet && matchStatus;
        });
      });

      watch([searchQuery, selectedSheet, selectedStatus], () => {
        currentPage.value = 1;
      });

      // Statistik Summary Cards
      const statCount = computed(() => filteredData.value.length);
      const statBruto = computed(() => filteredData.value.reduce((sum, item) => sum + (item.jumlahBruto || 0), 0));
      const statPajak = computed(() => filteredData.value.reduce((sum, item) => sum + (item.jumlahPajak || 0), 0));
      const statNetto = computed(() => filteredData.value.reduce((sum, item) => sum + (item.jumlahNetto || 0), 0));

      const totalPages = computed(() => {
        return Math.ceil(filteredData.value.length / itemsPerPage.value) || 1;
      });

      const startIndex = computed(() => {
        return (currentPage.value - 1) * itemsPerPage.value;
      });

      const endIndex = computed(() => {
        const end = startIndex.value + itemsPerPage.value;
        return end > filteredData.value.length ? filteredData.value.length : end;
      });

      const paginatedData = computed(() => {
        return filteredData.value.slice(startIndex.value, endIndex.value);
      });

      // Logika Pagination Maksimal 5 Tombol dengan Ellipsis (...)
      const visiblePages = computed(() => {
        let pages = [];
        let total = totalPages.value;
        let current = currentPage.value;
        
        if (total <= 5) {
          for (let i = 1; i <= total; i++) pages.push(i);
        } else {
          if (current <= 3) {
            pages = [1, 2, 3, 4, '...', total];
          } else if (current >= total - 2) {
            pages = [1, '...', total - 3, total - 2, total - 1, total];
          } else {
            pages = [1, '...', current - 1, current, current + 1, '...', total];
          }
        }
        return pages;
      });

      const formatRupiah = (number) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
      };

      const getStatusClass = (status) => {
        const stLower = String(status).toLowerCase();
        if (stLower.includes('true') || stLower.includes('1') || stLower.includes('lunas')) {
          return 'bg-emerald-50 text-emerald-600 border border-emerald-200';
        } else if (stLower.includes('false') || stLower.includes('0')) {
          return 'bg-rose-50 text-rose-600 border border-rose-200';
        }
        return 'bg-slate-100 text-slate-600 border border-slate-200';
      };

      const showDetail = (item) => {
        selectedItem.value = item;
        isModalOpen.value = true;
      };

      const closeModal = () => {
        isModalOpen.value = false;
      };

      const resetFilters = () => {
        searchQuery.value = '';
        selectedSheet.value = 'ALL';
        selectedStatus.value = 'ALL';
        currentPage.value = 1;
      };

      // State untuk Modal Iframe Google Drive & Spinner Loading (Dinamis via folderId)
      const isIframeModalOpen = ref(false);
      const iframeTitle = ref('');
      const currentEmbedUrl = ref('');
      const currentWebUrl = ref('');
      const iframeKey = ref(0);
      const isLoadingIframe = ref(true);

      const openDriveModal = (title, folderId) => {
        iframeTitle.value = title;
        currentEmbedUrl.value = `https://drive.google.com/embeddedfolderview?id=${folderId}#list`;
        currentWebUrl.value = `https://drive.google.com/drive/folders/${folderId}`;
        
        isLoadingIframe.value = true;
        iframeKey.value += 1;
        isIframeModalOpen.value = true;
      };

      const closeIframeModal = () => {
        isIframeModalOpen.value = false;
        currentEmbedUrl.value = '';
        currentWebUrl.value = '';
        isLoadingIframe.value = true;
      };

      const onIframeLoaded = () => {
        isLoadingIframe.value = false;
      };

      return {
        rawData,
        loading,
        syncing,
        searchQuery,
        selectedSheet,
        selectedStatus,
        sheetOptions,
        statusOptions,
        filteredData,
        statCount,
        statBruto,
        statPajak,
        statNetto,
        currentPage,
        itemsPerPage,
        totalPages,
        startIndex,
        endIndex,
        paginatedData,
        visiblePages,
        formatRupiah,
        getStatusClass,
        isModalOpen,
        selectedItem,
        showDetail,
        closeModal,
        resetFilters,
        fetchData,
        syncData,
        isIframeModalOpen,
        iframeTitle,
        currentEmbedUrl,
        currentWebUrl,
        iframeKey,
        isLoadingIframe,
        openDriveModal,
        closeIframeModal,
        onIframeLoaded
      };
    }
  };
</script>
