    setup() {
      const { ref, computed, onMounted, onBeforeUnmount, watch } = Vue;
      
      const rawData = ref([]);
      const loading = ref(true);
      const syncing = ref(false);
      
      const searchQuery = ref('');
      const selectedMonth = ref('ALL');
      const selectedYear = ref('ALL');
      const selectedSheet = ref('ALL');
      const selectedStatus = ref('ALL');

      const itemsPerPage = ref(10);
      
      const isModalOpen = ref(false);

      const monthNames = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];

      const monthOptions = monthNames.map((label, idx) => ({
        value: String(idx + 1).padStart(2, '0'),
        label
      }));

      const extractMonthYear = (item) => {
        let month = '';
        let year = '';

        const rawM = String(item.inPpkMonth || '').trim();
        const rawY = String(item.inPpkYear || '').trim();

        if (/^\d{1,2}$/.test(rawM)) {
          const numM = parseInt(rawM, 10);
          if (numM >= 1 && numM <= 12) month = String(numM).padStart(2, '0');
        } else if (rawM && rawM !== '-') {
          const foundIdx = monthNames.findIndex(m => m.toLowerCase() === rawM.toLowerCase());
          if (foundIdx !== -1) month = String(foundIdx + 1).padStart(2, '0');
        }

        if (/^\d{4}$/.test(rawY)) {
          year = rawY;
        }

        const tglStr = String(item.tanggalSpby || '').trim();
        if (tglStr && tglStr !== '-') {
          const isoMatch = tglStr.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
          if (isoMatch) {
            if (!year) year = isoMatch[1];
            if (!month) month = String(parseInt(isoMatch[2], 10)).padStart(2, '0');
          } else {
            const dmyMatch = tglStr.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
            if (dmyMatch) {
              if (!month) month = String(parseInt(dmyMatch[2], 10)).padStart(2, '0');
              if (!year) year = dmyMatch[3];
            } else {
              const idMatch = tglStr.match(/\b(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})\b/);
              if (idMatch) {
                const mIdx = monthNames.findIndex(m => m.toLowerCase().startsWith(idMatch[2].toLowerCase().slice(0, 3)));
                if (!month && mIdx !== -1) month = String(mIdx + 1).padStart(2, '0');
                if (!year) year = idMatch[3];
              }
            }
          }
        }

        return { month, year };
      };

      const toast = ref({
        show: false,
        type: 'success',
        title: '',
        message: ''
      });
      let toastTimer = null;

      const hideToast = () => {
        toast.value.show = false;
        if (toastTimer) {
          clearTimeout(toastTimer);
          toastTimer = null;
        }
      };

      const showToast = (type, title, message, duration = 3500) => {
        if (toastTimer) clearTimeout(toastTimer);
        toast.value = {
          show: true,
          type: type,
          title: title,
          message: message
        };
        toastTimer = setTimeout(() => {
          toast.value.show = false;
        }, duration);
      };

      const fetchData = () => {
        loading.value = true;
        google.script.run
          .withSuccessHandler(res => {
            loading.value = false;
            if (res && res.status) {
              rawData.value = res.data || [];
              showToast('success', 'Data Berhasil Dimuat', `Berhasil memuat ${rawData.value.length} data SPBY dari sheet.`);
            } else {
              showToast('error', 'Gagal Memuat Data', (res && res.message) || 'Terjadi kesalahan saat mengambil data dari sheet.');
            }
          })
          .withFailureHandler(err => {
            loading.value = false;
            showToast('error', 'Gagal Memuat Data', (err && err.message) || 'Koneksi ke server gagal saat memuat data.');
          })
          .getSpbyDataLocal();
      };

      const syncData = () => {
        syncing.value = true;
        google.script.run
          .withSuccessHandler(res => {
            syncing.value = false;
            if (res && res.status) {
              rawData.value = res.data || [];
              showToast('success', 'Sinkronisasi Berhasil', `Data SPBY diperbarui (${rawData.value.length} baris).`);
            } else {
              showToast('error', 'Sinkronisasi Gagal', (res && res.message) || 'Gagal menyinkronkan data dari sheet eksternal.');
            }
          })
          .withFailureHandler(err => {
            syncing.value = false;
            showToast('error', 'Sinkronisasi Gagal', (err && err.message) || 'Terjadi kesalahan saat sinkronisasi data.');
          })
          .syncAndGetSpbyData();
      };

      onMounted(() => {
        fetchData();
      });

      onBeforeUnmount(() => {
        if (toastTimer) clearTimeout(toastTimer);
      });

      const yearOptions = computed(() => {
        const set = new Set();
        rawData.value.forEach(item => {
          const { year } = extractMonthYear(item);
          if (year) set.add(year);
        });
        return Array.from(set).sort((a, b) => b.localeCompare(a));
      });

      const sheetOptions = computed(() => {
        const set = new Set(rawData.value.map(i => i.sheetAsal).filter(Boolean));
        return Array.from(set);
      });

      const statusOptions = computed(() => {
        const set = new Set(rawData.value.map(i => String(i.sudahBayar)).filter(Boolean));
        return Array.from(set);
      });

      const filteredData = computed(() => {
        const query = searchQuery.value.toLowerCase();
        return rawData.value
          .filter(item => {
            const { month, year } = extractMonthYear(item);
            const matchSearch = String(item.noSpby).toLowerCase().includes(query) || 
                                String(item.noSpp).toLowerCase().includes(query) ||
                                String(item.pengusul).toLowerCase().includes(query) ||
                                String(item.pembayaran).toLowerCase().includes(query) ||
                                String(item.akun).toLowerCase().includes(query) ||
                                String(item.program).toLowerCase().includes(query);
            const matchMonth = selectedMonth.value === 'ALL' || month === selectedMonth.value;
            const matchYear = selectedYear.value === 'ALL' || year === selectedYear.value;
            const matchSheet = selectedSheet.value === 'ALL' || item.sheetAsal === selectedSheet.value;
            const matchStatus = selectedStatus.value === 'ALL' || String(item.sudahBayar) === String(selectedStatus.value);
            return matchSearch && matchMonth && matchYear && matchSheet && matchStatus;
          })
          .sort((a, b) => {
            const rowA = Number(a.rowIndex) || 0;
            const rowB = Number(b.rowIndex) || 0;
            if (rowB !== rowA) return rowB - rowA;
            return (Number(b.noUrut) || 0) - (Number(a.noUrut) || 0);
          });
      });

      watch([searchQuery, selectedMonth, selectedYear, selectedSheet, selectedStatus, itemsPerPage], () => {
        currentPage.value = 1;
      });

      const statCount = computed(() => filteredData.value.length);
      const statBruto = computed(() => filteredData.value.reduce((sum, item) => sum + (item.jumlahBruto || 0), 0));
      const statPajak = computed(() => filteredData.value.reduce((sum, item) => sum + (item.jumlahPajak || 0), 0));
      const statNetto = computed(() => filteredData.value.reduce((sum, item) => sum + (item.jumlahNetto || 0), 0));

      const totalPages = computed(() => {
        return Math.ceil(filteredData.value.length / itemsPerPage.value) || 1;
      });

      watch(totalPages, (n) => {
        if (currentPage.value > n) currentPage.value = n;
      });

      const startIndex = computed(() => {
        return (currentPage.value - 1) * itemsPerPage.value;
      });

      const endIndex = computed(() => {
        const end = startIndex.value + itemsPerPage.value;
        return end > filteredData.value.length ? filteredData.value.length : end;
      });

      const paginatedData = computed(() => {
        return filteredData.value.slice(startIndex.value, endIndex.value);
      });

      const visiblePages = computed(() => {
        let pages = [];
        let total = totalPages.value;
        let current = currentPage.value;
        
        if (total <= 5) {
          for (let i = 1; i <= total; i++) pages.push(i);
        } else {
          if (current <= 3) {
            pages = [1, 2, 3, 4, '...', total];
          } else if (current >= total - 2) {
            pages = [1, '...', total - 3, total - 2, total - 1, total];
          } else {
            pages = [1, '...', current - 1, current, current + 1, '...', total];
          }
        }
        return pages;
      });

      const formatRupiah = (number) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
      };

      const getStatusClass = (status) => {
        const isPaid =
          status === true ||
          ['true', '1', 'lunas', 'sudah dibayar', 'sudah'].includes(String(status || '').trim().toLowerCase());
        return isPaid
          ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/80'
          : 'bg-rose-50 text-rose-700 border border-rose-200/80';
      };

      const showDetail = (item) => {
        selectedItem.value = item;
        isModalOpen.value = true;
      };

      const closeModal = () => {
        isModalOpen.value = false;
      };

      const resetFilters = () => {
        searchQuery.value = '';
        selectedMonth.value = 'ALL';
        selectedYear.value = 'ALL';
        selectedSheet.value = 'ALL';
        selectedStatus.value = 'ALL';
        currentPage.value = 1;
      };

      const isIframeModalOpen = ref(false);
      const iframeTitle = ref('');
      const currentEmbedUrl = ref('');
      const currentWebUrl = ref('');
      const iframeKey = ref(0);
      const isLoadingIframe = ref(true);

      const openDriveModal = (title, folderId) => {
        iframeTitle.value = title;
        currentEmbedUrl.value = `https://drive.google.com/embeddedfolderview?id=${folderId}#list`;
        currentWebUrl.value = `https://drive.google.com/drive/folders/${folderId}`;
        
        isLoadingIframe.value = true;
        iframeKey.value += 1;
        isIframeModalOpen.value = true;
      };

      const closeIframeModal = () => {
        isIframeModalOpen.value = false;
        currentEmbedUrl.value = '';
        currentWebUrl.value = '';
        isLoadingIframe.value = true;
      };

      const onIframeLoaded = () => {
        isLoadingIframe.value = false;
      };

      return {
        rawData,
        loading,
        syncing,
        toast,
        hideToast,
        showToast,
        searchQuery,
        selectedMonth,
        selectedYear,
        monthOptions,
        yearOptions,
        selectedSheet,
        selectedStatus,
        sheetOptions,
        statusOptions,
        filteredData,
        statCount,
        statBruto,
        statPajak,
        statNetto,
        currentPage,
        itemsPerPage,
        totalPages,
        startIndex,
        endIndex,
        paginatedData,
        visiblePages,
        formatRupiah,
        getStatusClass,
        isModalOpen,
        selectedItem,
        showDetail,
        closeModal,
        resetFilters,
        fetchData,
        syncData,
        isIframeModalOpen,
        iframeTitle,
        currentEmbedUrl,
        currentWebUrl,
        iframeKey,
        isLoadingIframe,
        openDriveModal,
        closeIframeModal,
        onIframeLoaded
      };
    }
  };
</script>
