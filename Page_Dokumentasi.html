              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Link Dokumentasi <span class="text-red-500">*</span></label>
                <input type="url" v-model="form.link_dokumentasi" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://...">
              </div>

              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Tags <span class="text-gray-400">(Opsional)</span></label>
                <input type="text" v-model="form.tags" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Misal: Laporan, Kegiatan, Foto">
              </div>

              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Keterangan <span class="text-gray-400">(Opsional)</span></label>
                <textarea v-model="form.keterangan" rows="2" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </div>

              <div class="flex justify-end space-x-2 pt-2">
                <button type="button" @click="closeModal" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">Batal</button>
                <button type="submit" :disabled="saving" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition disabled:opacity-50 shadow-sm">
                  {{ saving ? 'Menyimpan...' : 'Simpan' }}
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Modal Konfirmasi Hapus Kustom dengan Animasi Buka & Tutup Smooth -->
        <div v-if="isDeleteModalOpen"
             @click.self="closeDeleteModal"
             :class="deleteModalVisible ? 'opacity-100 duration-300 ease-out' : 'opacity-0 duration-200 ease-in pointer-events-none'"
             class="fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] z-50 flex items-center justify-center p-4 transition-opacity will-change-opacity">
          <div :class="deleteModalVisible ? 'opacity-100 scale-100 translate-y-0 duration-300 ease-out' : 'opacity-0 scale-95 translate-y-3 duration-200 ease-in'"
               class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center space-y-4 transition-all will-change-transform">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
              ⚠️
            </div>
            <div>
              <h3 class="font-bold text-gray-900 text-lg">Konfirmasi Hapus</h3>
              <p class="text-xs text-gray-500 mt-1">Apakah Anda yakin ingin menghapus data dokumentasi ini? Tindakan ini tidak dapat dibatalkan.</p>
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button @click="closeDeleteModal" type="button" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition w-full">Batal</button>
              <button @click="executeDelete" type="button" :disabled="deleting" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition w-full disabled:opacity-50 shadow-sm">
                {{ deleting ? 'Menghapus...' : 'Ya, Hapus' }}
              </button>
            </div>
          </div>
        </div>

        <!-- Toast Notification (Hijau Smooth / Merah Smooth) -->
        <div v-if="toast.show"
             :class="[
               'fixed bottom-5 right-5 z-[60] max-w-sm w-full rounded-2xl shadow-xl border p-4 flex items-start gap-3 transition-all duration-300',
               toast.type === 'success'
                 ? 'bg-emerald-50/95 border-emerald-200 text-emerald-900'
                 : 'bg-rose-50/95 border-rose-200 text-rose-900'
             ]">
          <div :class="[
            'w-8 h-8 rounded-xl flex items-center justify-center shrink-0 mt-0.5 text-sm font-bold border',
            toast.type === 'success'
              ? 'bg-emerald-100 text-emerald-700 border-emerald-200'
              : 'bg-rose-100 text-rose-700 border-rose-200'
          ]">
            {{ toast.type === 'success' ? '✓' : '!' }}
          </div>
          <div class="flex-1 text-xs leading-relaxed">
            <p class="font-bold text-sm tracking-tight">{{ toast.title }}</p>
            <p :class="toast.type === 'success' ? 'text-emerald-800/85 mt-0.5' : 'text-rose-800/85 mt-0.5'">{{ toast.message }}</p>
          </div>
          <button @click="hideToast" type="button" title="Tutup"
                  :class="[
                    'text-sm font-bold px-1.5 py-0.5 rounded-lg transition cursor-pointer',
                    toast.type === 'success'
                      ? 'text-emerald-600/70 hover:text-emerald-900 hover:bg-emerald-200/60'
                      : 'text-rose-600/70 hover:text-rose-900 hover:bg-rose-200/60'
                  ]">
            ✕
          </button>
        </div>

      </div>
    `,
    setup() {
      const { ref, computed, onMounted, onBeforeUnmount, watch, nextTick } = Vue;
      
      const daftarBulanMap = {
        'Januari': 1, 'Februari': 2, 'Maret': 3, 'April': 4, 'Mei': 5, 'Juni': 6,
        'Juli': 7, 'Agustus': 8, 'September': 9, 'Oktober': 10, 'November': 11, 'Desember': 12
      };

      const tableData = ref([]);
      const loading = ref(true);
      const saving = ref(false);
      const deleting = ref(false);
      const viewMode = ref('table'); // 'table' | 'card'
      
      const searchQuery = ref('');
      const selectedBulan = ref('');
      const selectedTahun = ref('');
      const sortField = ref('tahun');
      const sortAsc = ref(false);
      
      const currentPage = ref(1);
      const itemsPerPage = ref(10);
      
      const isModalOpen = ref(false);
      const modalVisible = ref(false);
      const isDeleteModalOpen = ref(false);
      const deleteModalVisible = ref(false);
      const itemToDelete = ref(null);
      let modalCloseTimer = null;
      let deleteModalCloseTimer = null;

      const toast = ref({
        show: false,
        title: '',
        message: '',
        type: 'success'
      });
      let toastTimer = null;

      const hideToast = () => {
        toast.value.show = false;
        if (toastTimer) {
          clearTimeout(toastTimer);
          toastTimer = null;
        }
      };

      const showToast = (message, type = 'success', title = null) => {
        if (toastTimer) clearTimeout(toastTimer);
        const defaultTitle = type === 'success' ? 'Berhasil' : 'Terjadi Kesalahan';
        toast.value = {
          show: true,
          title: title || defaultTitle,
          message,
          type
        };
        toastTimer = setTimeout(() => {
          toast.value.show = false;
        }, 3500);
      };

      const daftarBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

      const form = ref({
        rowIndex: '',
        tanggal: new Date().getDate(),
        bulan: daftarBulan[new Date().getMonth()],
        tahun: new Date().getFullYear(),
        deskripsi: '',
        link_dokumentasi: '',
        tags: '',
        keterangan: ''
      });

      const fetchData = () => {
        loading.value = true;
        google.script.run
          .withSuccessHandler(res => {
            loading.value = false;
            if (res && res.status) {
              tableData.value = res.data || [];
              showToast(`Berhasil memuat ${tableData.value.length} data dokumentasi dari sheet.`, 'success', 'Data Berhasil Dimuat');
            } else {
              showToast((res && res.message) || 'Gagal memuat data dari sheet.', 'error', 'Gagal Memuat Data');
            }
          })
          .withFailureHandler(err => {
            loading.value = false;
            showToast("Gagal memuat data: " + (err && err.message ? err.message : 'Koneksi gagal'), 'error', 'Gagal Memuat Data');
          })
          .getDokumentasiData();
      };

      onMounted(() => {
        fetchData();
      });

      const uniqueTahun = computed(() => {
        const tahuns = tableData.value.map(item => item.tahun).filter(Boolean);
        return [...new Set(tahuns)].sort((a, b) => b - a);
      });

      const filteredData = computed(() => {
        return tableData.value.filter(item => {
          const matchSearch = (item.deskripsi || '').toLowerCase().includes(searchQuery.value.toLowerCase()) ||
                              (item.keterangan || '').toLowerCase().includes(searchQuery.value.toLowerCase());
          const matchBulan = selectedBulan.value === '' || item.bulan === selectedBulan.value;
          const matchTahun = selectedTahun.value === '' || String(item.tahun) === String(selectedTahun.value);
          return matchSearch && matchBulan && matchTahun;
        }).sort((a, b) => {
          let modifier = sortAsc.value ? 1 : -1;
          
          if (sortField.value === 'tahun') {
            let thnDiff = (Number(b.tahun) - Number(a.tahun)) * -modifier;
            if (thnDiff !== 0) return thnDiff;

            let blnDiff = (daftarBulanMap[b.bulan] - daftarBulanMap[a.bulan]) * -modifier;
            if (blnDiff !== 0) return blnDiff;

            return (Number(b.tanggal) - Number(a.tanggal)) * -modifier;
          } else {
            let valA = a[sortField.value];
            let valB = b[sortField.value];
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();
            if (valA < valB) return -1 * modifier;
            if (valA > valB) return 1 * modifier;
            return 0;
          }
        });
      });

      watch([searchQuery, selectedBulan, selectedTahun], () => {
        currentPage.value = 1;
      });

      const totalPages = computed(() => {
        return Math.ceil(filteredData.value.length / itemsPerPage.value) || 1;
      });

      watch(totalPages, (n) => {
        if (currentPage.value > n) currentPage.value = n;
      });

      const startIndex = computed(() => {
        return (currentPage.value - 1) * itemsPerPage.value;
      });

      const endIndex = computed(() => {
        const end = startIndex.value + itemsPerPage.value;
        return end > filteredData.value.length ? filteredData.value.length : end;
      });

      const paginatedData = computed(() => {
        return filteredData.value.slice(startIndex.value, endIndex.value);
      });

      const sortBy = (field) => {
        if (sortField.value === field) {
          sortAsc.value = !sortAsc.value;
        } else {
          sortField.value = field;
          sortAsc.value = true;
        }
      };

      const triggerSmoothOpen = (openRef, visibleRef, setTimer) => {
        const prevTimer = setTimer(null);
        if (prevTimer) clearTimeout(prevTimer);
        openRef.value = true;
        visibleRef.value = false;
        nextTick(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              visibleRef.value = true;
            });
          });
        });
      };

      const triggerSmoothClose = (openRef, visibleRef, setTimer, onClosed) => {
        visibleRef.value = false;
        const timer = setTimeout(() => {
          openRef.value = false;
          if (onClosed) onClosed();
        }, 200);
        setTimer(timer);
      };

      const openModal = (item = null) => {
        if (item) {
          form.value = { ...item };
        } else {
          form.value = {
            rowIndex: '',
            tanggal: new Date().getDate(),
            bulan: daftarBulan[new Date().getMonth()],
            tahun: new Date().getFullYear(),
            deskripsi: '',
            link_dokumentasi: '',
            tags: '',
            keterangan: ''
          };
        }
        triggerSmoothOpen(isModalOpen, modalVisible, (t) => {
          const old = modalCloseTimer;
          modalCloseTimer = t;
          return old;
        });
      };

      const closeModal = () => {
        triggerSmoothClose(isModalOpen, modalVisible, (t) => {
          const old = modalCloseTimer;
          modalCloseTimer = t;
          return old;
        });
      };

      const saveData = () => {
        saving.value = true;
        google.script.run
          .withSuccessHandler(res => {
            saving.value = false;
            if (res.status) {
              showToast(res.message, 'success');
              closeModal();
              fetchData();
            } else {
              showToast(res.message, 'error');
            }
          })
          .withFailureHandler(err => {
            saving.value = false;
            showToast("Terjadi kesalahan: " + err.message, 'error');
          })
          .saveDokumentasi(JSON.parse(JSON.stringify(form.value)));
      };

      const confirmDelete = (item) => {
        itemToDelete.value = item;
        triggerSmoothOpen(isDeleteModalOpen, deleteModalVisible, (t) => {
          const old = deleteModalCloseTimer;
          deleteModalCloseTimer = t;
          return old;
        });
      };

      const closeDeleteModal = () => {
        triggerSmoothClose(isDeleteModalOpen, deleteModalVisible, (t) => {
          const old = deleteModalCloseTimer;
          deleteModalCloseTimer = t;
          return old;
        }, () => {
          if (!deleting.value) itemToDelete.value = null;
        });
      };

      const executeDelete = () => {
        if (!itemToDelete.value) return;
        deleting.value = true;

        google.script.run
          .withSuccessHandler(res => {
            deleting.value = false;
            closeDeleteModal();
            itemToDelete.value = null;
            if (res.status) {
              showToast(res.message, 'success');
              fetchData();
            } else {
              showToast(res.message, 'error');
            }
          })
          .withFailureHandler(err => {
            deleting.value = false;
            closeDeleteModal();
            showToast("Gagal menghapus: " + err.message, 'error');
          })
          .deleteDokumentasi(itemToDelete.value.rowIndex);
      };

      const handleKeydown = (e) => {
        if (e.key === 'Escape') {
          if (deleteModalVisible.value) closeDeleteModal();
          else if (modalVisible.value) closeModal();
        }
      };

      onMounted(() => {
        window.addEventListener('keydown', handleKeydown);
      });

      onBeforeUnmount(() => {
        window.removeEventListener('keydown', handleKeydown);
        if (modalCloseTimer) clearTimeout(modalCloseTimer);
        if (deleteModalCloseTimer) clearTimeout(deleteModalCloseTimer);
      });

      const visiblePages = computed(() => {
        let pages = [];
        let total = totalPages.value;
        let current = currentPage.value;
        
        if (total <= 5) {
          for (let i = 1; i <= total; i++) pages.push(i);
        } else {
          if (current <= 3) {
            pages = [1, 2, 3, 4, '...', total];
          } else if (current >= total - 2) {
            pages = [1, '...', total - 3, total - 2, total - 1, total];
          } else {
            pages = [1, '...', current - 1, current, current + 1, '...', total];
          }
        }
        return pages;
      });

      const resetFilters = () => {
        searchQuery.value = '';
        selectedBulan.value = '';
        selectedTahun.value = '';
        currentPage.value = 1;
      };

      return {
        tableData,
        loading,
        saving,
        deleting,
        viewMode,
        searchQuery,
        selectedBulan,
        selectedTahun,
        daftarBulan,
        uniqueTahun,
        sortField,
        sortAsc,
        currentPage,
        itemsPerPage,
        totalPages,
        startIndex,
        endIndex,
        paginatedData,
        sortBy,
        isModalOpen,
        modalVisible,
        isDeleteModalOpen,
        deleteModalVisible,
        form,
        openModal,
        closeModal,
        saveData,
        confirmDelete,
        closeDeleteModal,
        executeDelete,
        fetchData,
        filteredData,
        visiblePages,
        toast,
        hideToast,
        showToast,
        resetFilters
      };
    }
  };
</script>
